# nginx proxy address - http://172.17.0.1:59338

name: uvdesk
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: nuttcorp/uvdesk:latest
    container_name: uvdesk-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MYSQL_HOST: uvdesk-db
      MYSQL_USER: ${DB_USER_NAME:-uvdesk}
      MYSQL_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-uvdesk}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
    ports:
      - '172.17.0.1:59338:80'
    volumes:
      - './volumes/data/uvdesk:/var/www/html/uvdesk'
    depends_on:
      uvdesk-db:
        condition: service_healthy
    networks:
      - uvdesk

  uvdesk-db:
    image: mariadb:latest
    container_name: uvdesk-db
    hostname: uvdesk-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_USER: ${DB_USER_NAME:-uvdesk}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-uvdesk}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/data/db/mysql:/var/lib/mysql'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - uvdesk

networks:
  uvdesk:
    name: uvdesk
    external: false
